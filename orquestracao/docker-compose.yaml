# Airflow do foota-toota: LocalExecutor com Postgres, sem Celery nem Redis. A interface escuta
# só em 127.0.0.1:8080; na VM, o acesso é por túnel SSH via IAP (vm.sh tunel).
#
# Segredos em .env e senhas/senhas.json, gerados por gerar_segredos.sh (fora do git).
# As credenciais do GCP vêm da service account da VM, pelo metadata server.

x-airflow: &airflow
  image: apache/airflow:3.3.2-python3.12
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped
  environment: &ambiente
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/senhas/senhas.json
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?rode gerar_segredos.sh}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?rode gerar_segredos.sh}@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET:?rode gerar_segredos.sh}
    AIRFLOW__API__SECRET_KEY: ${API_SECRET:?rode gerar_segredos.sh}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: '{"conn_type": "google_cloud_platform", "extra": {"project": "pdm-bia-505511"}}'
    GCP_PROJECT_ID: pdm-bia-505511
    # dags/foota/ são módulos dos DAGs, importados por todos os componentes
    PYTHONPATH: /opt/airflow/dags
    GOOGLE_CLOUD_PROJECT: pdm-bia-505511
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./senhas:/opt/airflow/senhas
    - logs:/opt/airflow/logs
  depends_on: &depende
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode gerar_segredos.sh}
      POSTGRES_DB: airflow
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *depende
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

volumes:
  postgres:
  logs:
