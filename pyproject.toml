[project]
name = "foota-toota"
version = "0.1.0"
description = "Plataforma de informações para fãs de futebol."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "André Koraleski", email = "andrekorale@gmail.com" }]
keywords = ["football", "sports-data", "bigballsdata", "pitchside"]
dependencies = [
    "pitchside>=0.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[project.scripts]
footatoota = "footatoota.__main__:main"

[project.urls]
Repository = "https://github.com/phael-exe/foota-toota"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footatoota"]

[tool.ruff]
target-version = "py312"
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "RUF",
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers", "--strict-config"]
markers = [
    "live: hits the real Big Balls Data API and needs BIGBALLSDATA_API_KEY",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/footatoota"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
